[project]
name = "isis_report"
version = "0.1.0"
description = "Isis Report with Robyn"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "isis-report-lib>=0.3.0",
    "jinja2",
    "playwright",
    "robyn[all]",
]

[tool.setuptools.packages.find]
where = ["app"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-html", "pytest-cov", "ruff"]
[tool.ruff]
line-length = 140
indent-width = 4
target-version = "py314"
src = ["app"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line too long
]
[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
